<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Signature Wedding Sylhet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-body">
  <div class="login-card">
    <p class="eyebrow">Admin Panel</p>
    <h1>Signature Wedding</h1>
    <form id="login-form">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autofocus>
      </div>
      <p id="login-error" class="login-error" hidden>Invalid password</p>
      <button type="submit" class="btn btn-gold">Sign In</button>
    </form>
    <a class="back-link" href="../index.html">&larr; Back to website</a>
  </div>
  <script src="admin.js"></script>
</body>
</html>
